<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Smart Pharmacy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

   <header class="navbar">

    <div class="logo">
        <span class="logo-icon">💊</span>
        <span>Smart Pharmacy</span>
    </div>

    <nav class="main-nav">

        <a href="index.html">Home</a>

        <a href="medicines.html">Medicines</a>
        
        <a href="orders.html">Orders</a>

        <a href="contact.html">Contact</a>

    </nav>

    <div class="nav-icons">

        <a href="cart.html" title="Cart">
            🛒
        </a>

        <a href="profile.html" title="Profile">👤</a>

    </div>

</header>


    <!-- Page Header -->
    <section class="page-header">

        <h1>Checkout</h1>

        <p>Complete your order</p>

    </section>


    <!-- Checkout -->
    <main class="checkout-container">

        <!-- Delivery Details -->
        <section class="checkout-form">

            <h2>Delivery Details</h2>

            <div class="form-group">

                <label for="checkoutName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="checkoutName"
                    placeholder="Enter your full name"
                >

            </div>


            <div class="form-group">

                <label for="checkoutPhone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="checkoutPhone"
                    maxlength="10"
                    placeholder="Enter your phone number"
                >

            </div>


            <div class="form-group">

                <label for="checkoutAddress">
                    Delivery Address
                </label>

                <textarea
                    id="checkoutAddress"
                    rows="4"
                    placeholder="Enter your complete address"
                ></textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="checkoutCity">
                        City
                    </label>

                    <input
                        type="text"
                        id="checkoutCity"
                        placeholder="Enter city"
                    >

                </div>


                <div class="form-group">

                    <label for="checkoutPincode">
                        Pincode
                    </label>

                    <input
                        type="text"
                        id="checkoutPincode"
                        maxlength="6"
                        placeholder="Enter pincode"
                    >

                </div>

            </div>


            <!-- Payment -->
            <h2 class="payment-title">
                Payment Method
            </h2>

            <div class="payment-options">

                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="cod"
                        checked
                    >

                    <span>
                        💵 Cash on Delivery
                    </span>

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment"
                        value="upi"
                    >

                    <span>
                        📱 UPI
                    </span>

                </label>

            </div>

        </section>


        <!-- Order Summary -->
        <aside class="checkout-summary">

            <h2>Order Summary</h2>

            <div id="checkoutItems"></div>


            <div class="summary-row">

                <span>Subtotal</span>

                <strong id="checkoutSubtotal">
                    ₹0
                </strong>

            </div>


            <div class="summary-row">

                <span>Delivery</span>

                <strong id="checkoutDelivery">
                    ₹0
                </strong>

            </div>


            <div class="summary-row total-row">

                <span>Total</span>

                <strong id="checkoutTotal">
                    ₹0
                </strong>

            </div>


            <button
                type="button"
                class="place-order-btn"
                onclick="placeOrder()"
            >
                Place Order
            </button>

        </aside>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 Smart Pharmacy. All Rights Reserved.
        </p>

    </footer>


    <script src="js/main.js"></script>

</body>
</html>
